<!-- Es la tabla con los metadatos descriptivos del objeto geográfico: código, nombre, geometría, descripción, PDF, etc.
El mapeo está en el siguiente bloque:
HTMLDescripcion = HTMLDescripcion.format(
                ID=row[0],
                cod=row[1],
                nom_corto=row[2],
                nombre=row[3],
                geom=row[4],
                descr=row[6],
                urlPdf="https://www.w3schools.com"
            ) -->



<!--<tr>
    <th scope="row">ID</th>
    <td>{ID}</td>
</tr>-->
<table class="table table-bordered tabla-ajustada">
  <tr>
    <th style="width: 5%;">Código</th>
    <td style="width: 30%;">{cod}</td>
    <th style="width: 10%;">Nombre corto</th>
    <td style="width: 35%;">{nom_corto}</td>
    <th style="width: 10%;">Geometría</th>
    <td style="width: 10%;">{geom}</td>
  </tr>
</table>

<table class="table table-bordered tabla-ajustada">
  <tr>
    <th style="width: 10%;">Descripción</th>
    <td style="width: 70%;">{descr}</td>
    <td style="width: 20%;" colspan="3">
      <a href="../fichas/ficha_{cod}.pdf" target="_blank">Normas de captura</a>
    </td>
  </tr>
</table>
