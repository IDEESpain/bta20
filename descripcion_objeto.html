<!-- Es la tabla con los metadatos descriptivos del objeto geográfico: código, nombre, geometría, descripción, PDF, etc.
El mapeo está en el siguiente bloque:
HTMLDescripcion = HTMLDescripcion.format(
                ID=row[0],
                cod=row[1],
                nom_corto=row[2],
                nombre=row[3],
                geom=row[4],
                descr=row[6],
                urlPdf="https://www.w3schools.com"
            ) -->



<!--<tr>
    <th scope="row">ID</th>
    <td>{ID}</td>
</tr>-->
<table class="table table-bordered tabla-ajustada">
  <tr>
    <th style="width: 5%;">Tabla</th>
    <td style="width: 30%;">{cod_nom_corto}</td>
    <th style="width: 10%;">Geometría</th>
    <td style="width: 35%;">{geom}</td>
    <td style="width: 20%;" colspan="3">
      {enlace_pdf}
    </td>
  </tr>
</table>

<table class="table table-bordered tabla-ajustada">
  <tr>
    <th style="width: 10%;">Descripción</th>
    <td style="width: 70%;">{descr}
      {modelo_ext}
    </td>
  </tr>
</table>

<!-- Ventana flotante (Modal) de aviso cuando no existe el PDF -->
<div class="modal fade" id="modalPDFNoDisponible" tabindex="-1" aria-labelledby="modalPDFLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title" id="modalPDFLabel">⚠️ Documento no disponible</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        Las <strong>Normas de captura</strong> (fichero PDF) para este objeto geográfico no se encuentran disponibles actualmente.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
