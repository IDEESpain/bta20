<script>
function mostrarAvisoPDF() {
  var modalEl = document.getElementById('modalPDFNoDisponible');
  if (modalEl && typeof bootstrap !== 'undefined') {
    var modal = new bootstrap.Modal(modalEl);
    modal.show();
  } else {
    alert("Las Normas de captura (PDF) no están disponibles actualmente.");
  }
}
</script>
